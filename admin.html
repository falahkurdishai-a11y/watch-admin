<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پەنەلا ڕێڤەبەری | Admin Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #333333;
            --dark-color: #121212;
            --light-color: #FFFFFF;
            --gray-color: #555555;
            --card-bg: #FFFFFF;
            --border-color: #f0f0f0;
        }

        body.dark-mode, body.red-mode {
            --primary-color: #FFFFFF;
            --dark-color: #FFFFFF;
            --light-color: #000000;
            --gray-color: #AAAAAA;
            --card-bg: #000000;
            --border-color: #222222;
            background-color: #000000 !important;
            color: #FFFFFF !important;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; outline: none; transition: background-color 0.3s, color 0.3s; }
        body { background-color: var(--light-color); color: var(--primary-color); line-height: 1.6; margin: 0; padding: 0; }

        /* Login Screen (وێنەیێ تایبەتێ دەمژمێری + member ڕێڤەبەر + Inputs) */
        #loginScreen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1a1a1a 0%, #000000 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: #FFFFFF;
            padding: 20px;
        }
        
        .rolex-img-container {
            width: 180px;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }
        .rolex-watch-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.4));
        }

        .login-box {
            background: #121212;
            border: 2px solid #d4af37;
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }
        .login-box h3 { color: #d4af37; margin-bottom: 15px; font-size: 18px; }
        .form-group { margin-bottom: 12px; text-align: right; }
        .form-group label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 12px; color: #ccc; }
        .form-group input { width: 100%; padding: 8px; border: 1px solid #444; border-radius: 5px; background: #000; color: #fff; font-size: 13px; }
        
        .btn-login {
            background: #d4af37; color: #000; padding: 10px; border: none; border-radius: 5px;
            font-weight: bold; cursor: pointer; width: 100%; font-size: 14px; margin-top: 10px;
        }
        .btn-login:hover { background: #f1c40f; }

        /* Hero Section */
        .hero-section { background-color: #FFFFFF; width: 100%; }
        body.dark-mode .hero-section, body.red-mode .hero-section { background-color: #000000; }

        .hero {
            position: relative; width: 100%; height: 350px;
            background: url('https://i.ibb.co/G4Nv2cYy/photo-2026-10-23-23-06-04.jpg') no-repeat center center/cover;
        }
        body.dark-mode .hero { background: url('https://user47700.na.imgto.link/public/20261024/2f01137b93d40e2a72b7462b-photo-2026-10-24-22-21-34.avif') no-repeat center center/cover !important; }
        body.red-mode .hero { background: url('https://user47700.na.imgto.link/public/20261024/fe53bcfc4a8a106ccb41dd79-photo-2026-10-24-22-43-18.avif') no-repeat center center/cover !important; }

        .admin-logout-btn {
            position: absolute; top: 20px; left: 20px; background: #e74c3c; color: #fff; padding: 8px 18px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 13px; z-index: 10; border: none;
        }

        .top-left-controls { position: absolute; top: 20px; left: 120px; display: flex; gap: 10px; z-index: 50; }
        .hero-theme-icon {
            background: rgba(255, 255, 255, 0.9); color: #121212; width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 16px; border: 2px solid #121212;
        }
        body.dark-mode .hero-theme-icon, body.red-mode .hero-theme-icon { background: rgba(0, 0, 0, 0.9); color: #FFFFFF; border-color: #FFFFFF; }
        
        .theme-dropdown-menu {
            display: none; position: absolute; top: 50px; left: 0; background: #FFFFFF; border: 2px solid #121212; border-radius: 10px; box-shadow: 0 8px 20px rgba(0,0,0,0.2); padding: 5px 0; min-width: 130px; z-index: 100; flex-direction: column;
        }
        body.dark-mode .theme-dropdown-menu, body.red-mode .theme-dropdown-menu { background: #000000; border-color: #FFFFFF; }
        .theme-option { display: flex; align-items: center; gap: 10px; padding: 8px 12px; cursor: pointer; font-size: 13px; font-weight: bold; color: var(--primary-color); }
        .theme-option:hover { background: rgba(0,0,0,0.08); }
        body.dark-mode .theme-option:hover, body.red-mode .theme-option:hover { background: rgba(255,255,255,0.15); }

        .container { max-width: 600px; margin: 30px auto; padding: 0 20px; }
        
        .category-filters { display: flex; justify-content: center; gap: 12px; margin-bottom: 35px; flex-wrap: wrap; }
        .filter-btn {
            background: #FFFFFF; border: 2px solid var(--dark-color); color: var(--primary-color);
            padding: 8px 20px; border-radius: 30px; cursor: pointer; font-weight: bold; font-size: 13px;
        }
        body.dark-mode .filter-btn, body.red-mode .filter-btn { background: #000000; border: 2px solid #FFFFFF; color: #FFFFFF; }
        .filter-btn:hover, .filter-btn.active { background: var(--dark-color); color: #FFFFFF; }
        body.dark-mode .filter-btn:hover, body.dark-mode .filter-btn.active,
        body.red-mode .filter-btn:hover, body.red-mode .filter-btn.active { background: #FFFFFF; color: #000000; }

        .products-grid { display: flex; flex-direction: column; gap: 40px; align-items: center; }

        .product-card {
            background: #FFFFFF; width: 100%; max-width: 420px;
            display: flex; flex-direction: column; align-items: center;
            padding-bottom: 15px; border-bottom: 1px solid var(--border-color); position: relative;
        }
        body.dark-mode .product-card, body.red-mode .product-card { background: #000000; }
        
        .locked-badge {
            position: absolute; top: 15px; right: 15px; background: #e74c3c; color: #fff;
            padding: 5px 12px; font-size: 12px; font-weight: bold; border-radius: 4px; z-index: 5;
        }

        .admin-card-controls {
            width: 100%; background: rgba(0,0,0,0.04); padding: 10px; margin-top: 10px;
            display: flex; flex-direction: column; gap: 8px; border-radius: 6px; border: 1px dashed #d4af37;
        }
        body.dark-mode .admin-card-controls { background: rgba(255,255,255,0.04); border-color: #d4af37; }

        .image-slider-container {
            position: relative; width: 100%; height: 320px; overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        .product-img { width: 100%; height: 100%; object-fit: contain; display: none; }
        .product-img.active-img { display: block; }

        .card-center-info { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; margin-top: 15px; text-align: center; }
        .card-product-title { font-size: 16px; font-weight: bold; }
        .card-bottom-row { display: flex; align-items: center; justify-content: center; gap: 20px; width: 100%; }
        .card-price-tag { font-size: 15px; font-weight: bold; }

        .btn {
            background: var(--dark-color); color: #FFFFFF; padding: 8px 15px; border: none; border-radius: 5px;
            font-weight: bold; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 5px;
        }
        body.dark-mode .btn, body.red-mode .btn { background: #FFFFFF; color: #000000; }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <!-- Login Screen (وێنەیێ دەمژمێری + member ڕێڤەبەر + Inputs) -->
    <div id="loginScreen">
        <div class="rolex-img-container">
            <img src="https://user47700.na.imgto.link/public/20261026/01b1b3eb61b7db8ab048f004-images-9-removebg-preview-1.avif" alt="Rolex Watch" class="rolex-watch-img">
        </div>
        
        <div class="login-box">
            <h3>member ڕێڤەبەر</h3>
            <form onsubmit="adminLogin(event)">
                <div class="form-group">
                    <label>ID:</label>
                    <input type="text" id="adminId" required value="falahjt">
                </div>
                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" id="adminPass" required value="falahjt">
                </div>
                <button type="submit" class="btn-login">چوونە ژوورێ</button>
            </form>
        </div>
    </div>

    <!-- Admin Store View -->
    <div id="adminStoreView" style="display: none;">
        <div class="hero-section">
            <div class="hero">
                <button class="admin-logout-btn" onclick="adminLogout()"><i class="fa-solid fa-right-from-bracket"></i> چوونە دەر</button>
                
                <div class="top-left-controls">
                    <div class="hero-theme-icon" onclick="toggleThemeMenu(event)" title="گۆهۆڕینا مۆدان">
                        <i class="fa-solid fa-palette" id="masterThemeIcon"></i>
                    </div>
                    <div class="theme-dropdown-menu" id="themeDropdownMenu">
                        <div class="theme-option" onclick="setTheme('light')">
                            <i class="fa-solid fa-sun" style="color: #f39c12;"></i> <span>Light Mode</span>
                        </div>
                        <div class="theme-option" onclick="setTheme('dark')">
                            <i class="fa-solid fa-moon" style="color: #ffffff;"></i> <span>Dark Mode</span>
                        </div>
                        <div class="theme-option" onclick="setTheme('red')">
                            <i class="fa-solid fa-fire" style="color: #ff4d4d;"></i> <span>Red Mode</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="container">
            <div class="category-filters" id="filter-buttons">
                <button class="filter-btn active" onclick="filterProducts('all', this)">هەمی دەمژمێر</button>
            </div>

            <div class="products-grid" id="product-list">
                <p style="text-align: center; grid-column: 1/-1;">داتایێن دەمژمێران دهێنە بارکرن...</p>
            </div>
        </div>
    </div>

    <script>
        const sheetCSVUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQUgGUp_uVa2N2S9b3HgLGtTEtBJN5LOb20GfRDO_NVhWq1M1pOVHiyH37rHcLPAGDysRRUmbJvyFw_/pub?output=csv';
        let allProducts = [];
        let currentFilterBrand = 'all';

        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('adminStoreView').style.display = 'none';

        function adminLogin(event) {
            event.preventDefault();
            const id = document.getElementById('adminId').value.trim();
            const pass = document.getElementById('adminPass').value.trim();

            if (id === 'falahjt' && pass === 'falahjt') {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminStoreView').style.display = 'block';
                fetchSheetData();
            } else {
                alert('خەلەتی د ناڤێکار یان کلیلۆشێ دا هەیە!');
            }
        }

        function adminLogout() {
            location.reload();
        }

        function toggleThemeMenu(event) {
            event.stopPropagation();
            const menu = document.getElementById('themeDropdownMenu');
            menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
        }

        window.addEventListener('click', function() {
            const menu = document.getElementById('themeDropdownMenu');
            if(menu) menu.style.display = 'none';
        });

        function setTheme(mode) {
            document.body.classList.remove('dark-mode', 'red-mode');
            const masterIcon = document.getElementById('masterThemeIcon');
            
            if (mode === 'dark') {
                document.body.classList.add('dark-mode');
                masterIcon.className = 'fa-solid fa-moon';
            } else if (mode === 'red') {
                document.body.classList.add('red-mode');
                masterIcon.className = 'fa-solid fa-fire';
            } else {
                masterIcon.className = 'fa-solid fa-sun';
            }
            document.getElementById('themeDropdownMenu').style.display = 'none';
        }

        async function fetchSheetData() {
            try {
                const response = await fetch(sheetCSVUrl);
                const data = await response.text();
                parseCSV(data);
            } catch (error) {
                console.error('خەلەتی:', error);
            }
        }

        function parseCSV(text) {
            const lines = text.split('\n');
            allProducts = [];
            
            let savedLocks = JSON.parse(localStorage.getItem('productLocks') || '{}');
            let savedDiscounts = JSON.parse(localStorage.getItem('productDiscounts') || '{}');

            for (let i = 1; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line) continue;

                let row = [];
                let inQuotes = false;
                let currentVal = '';
                
                for (let char of line) {
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        row.push(currentVal.trim());
                        currentVal = '';
                    } else {
                        currentVal += char;
                    }
                }
                row.push(currentVal.trim());

                if (row.length >= 7) {
                    let pId = i - 1;
                    const product = {
                        id: pId,
                        name: row[0].replace(/^"|"$/g, ''),
                        brand: row[1].toLowerCase().replace(/^"|"$/g, ''),
                        price: row[2].replace(/^"|"$/g, ''),
                        imgs: [
                            row[3].replace(/^"|"$/g, ''),
                            row[4].replace(/^"|"$/g, ''),
                            row[5].replace(/^"|"$/g, '')
                        ].filter(img => img !== ''),
                        isLocked: savedLocks[pId] !== undefined ? savedLocks[pId] : false,
                        discountVal: savedDiscounts[pId] !== undefined ? savedDiscounts[pId] : ''
                    };
                    
                    if (product.name) {
                        allProducts.push(product);
                        availableBrands.add(product.brand);
                    }
                }
            }

            buildFilterButtons();
            filterProducts(currentFilterBrand, document.querySelector('.filter-btn'));
        }

        let availableBrands = new Set(['all']);
        function buildFilterButtons() {
            const filterContainer = document.getElementById('filter-buttons');
            filterContainer.innerHTML = `<button class="filter-btn active" onclick="filterProducts('all', this)">هەمی دەمژمێر</button>`;

            availableBrands.forEach(brand => {
                if (brand !== 'all') {
                    let btn = document.createElement('button');
                    btn.className = 'filter-btn';
                    btn.setAttribute('onclick', `filterProducts('${brand}', this)`);
                    btn.innerText = brand.toUpperCase();
                    filterContainer.appendChild(btn);
                }
            });
        }

        const productListContainer = document.getElementById('product-list');

        function displayProducts(filteredProducts) {
            productListContainer.innerHTML = '';
            if(filteredProducts.length === 0) {
                productListContainer.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #aaa;">چ دەمژمێر نینن.</p>';
                return;
            }

            filteredProducts.forEach((product) => {
                const card = document.createElement('div');
                card.className = 'product-card';
                
                let lockBadgeHTML = product.isLocked ? `<div class="locked-badge"><i class="fa-solid fa-lock"></i> قفلكرییە</div>` : '';

                let imagesHTML = '';
                product.imgs.forEach((imgUrl, imgIdx) => {
                    let activeClass = imgIdx === 0 ? 'active-img' : '';
                    imagesHTML += `<img src="${imgUrl}" class="product-img ${activeClass}" alt="Watch">`;
                });

                if(product.imgs.length === 0) {
                    imagesHTML = `<img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80" class="product-img active-img">`;
                }

                let displayPriceHTML = `<div class="card-price-tag">${product.price}</div>`;
                let rawPriceNum = parseFloat(product.price.replace(/[^0-9.]/g, '')) || 0;

                if (product.discountVal) {
                    let finalPriceStr = product.discountVal;
                    if (product.discountVal.includes('%')) {
                        let percent = parseFloat(product.discountVal) || 0;
                        let discountedNum = rawPriceNum - (rawPriceNum * (percent / 100));
                        finalPriceStr = discountedNum.toLocaleString() + ' د.ع';
                    } else if (rawPriceNum > 0) {
                        let discNum = parseFloat(product.discountVal) || 0;
                        let discountedNum = rawPriceNum - discNum;
                        finalPriceStr = discountedNum.toLocaleString() + ' د.ع';
                    }

                    displayPriceHTML = `
                        <div class="card-price-tag">
                            <span style="text-decoration: line-through; color: #888; font-size: 13px; margin-left: 8px;">${product.price}</span>
                            <span style="color: #e74c3c;">${finalPriceStr} (${product.discountVal} داشکان)</span>
                        </div>
                    `;
                }

                let lockBtnText = product.isLocked ? 'ڤەکەرەوە (Unlock)' : 'قفل بکە (Lock)';
                let lockBtnBg = product.isLocked ? '#27ae60' : '#e74c3c';

                card.innerHTML = `
                    ${lockBadgeHTML}
                    <div class="image-slider-container">
                        ${imagesHTML}
                    </div>
                    <div class="card-center-info">
                        <div class="card-product-title">${product.name}</div>
                        <div class="card-bottom-row">
                            ${displayPriceHTML}
                        </div>

                        <div class="admin-card-controls">
                            <div style="display: flex; gap: 5px;">
                                <input type="text" id="disc-input-${product.id}" placeholder="داشکاندن (50% یان 15000)" value="${product.discountVal}" style="flex:1; padding:6px; font-size:12px; border:1px solid #ccc; border-radius:4px; background:var(--card-bg); color:var(--primary-color);">
                                <button class="btn" style="padding: 6px 12px; font-size: 12px; background: #3498db; color:#fff;" onclick="applyDiscount(${product.id})">دانان</button>
                            </div>
                            <button class="btn" style="padding: 7px; font-size: 12px; background: ${lockBtnBg}; color: #fff;" onclick="toggleLock(${product.id})">${lockBtnText}</button>
                        </div>
                    </div>
                `;
                productListContainer.appendChild(card);
            });
        }

        function filterProducts(brand, buttonElement) {
            currentFilterBrand = brand;
            if (buttonElement) {
                document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                buttonElement.classList.add('active');
            }

            if (brand === 'all') {
                displayProducts(allProducts);
            } else {
                const filtered = allProducts.filter(p => p.brand === brand);
                displayProducts(filtered);
            }
        }

        function toggleLock(productId) {
            let product = allProducts.find(p => p.id === productId);
            if(product) {
                product.isLocked = !product.isLocked;
                
                let savedLocks = {};
                allProducts.forEach(p => { savedLocks[p.id] = p.isLocked; });
                localStorage.setItem('productLocks', JSON.stringify(savedLocks));

                filterProducts(currentFilterBrand, null);
            }
        }

        function applyDiscount(productId) {
            let product = allProducts.find(p => p.id === productId);
            let val = document.getElementById(`disc-input-${productId}`).value.trim();
            if(product) {
                product.discountVal = val;

                let savedDiscounts = {};
                allProducts.forEach(p => { savedDiscounts[p.id] = p.discountVal; });
                localStorage.setItem('productDiscounts', JSON.stringify(savedDiscounts));

                alert(`داشکاندن بۆ بەرهەمێ (${product.name}) هاتە سەرخستن!`);
                filterProducts(currentFilterBrand, null);
            }
        }
    </script>
</body>
</html>
