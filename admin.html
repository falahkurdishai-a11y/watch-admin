<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پەنەلا ڕێڤەبەری | Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #333333;
            --dark-color: #121212;
            --light-color: #FFFFFF;
            --gray-color: #555555;
            --border-color: #f0f0f0;
        }

        body.dark-mode, body.red-mode {
            --primary-color: #FFFFFF;
            --dark-color: #FFFFFF;
            --light-color: #000000;
            --gray-color: #AAAAAA;
            --border-color: #222222;
            background-color: #000000 !important;
            color: #FFFFFF !important;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; outline: none; transition: background-color 0.3s, color 0.3s; }
        body { background-color: var(--light-color); color: var(--primary-color); line-height: 1.6; }

        /* Login Screen بۆ ڕێڤەبەری */
        #adminLoginScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1a1a1a 0%, #000000 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; color: #FFFFFF; padding: 20px;
        }
        .login-box {
            background: #121212; border: 2px solid #e67e22;
            padding: 25px; border-radius: 12px; width: 100%; max-width: 350px; text-align: center;
        }
        .form-group { margin-bottom: 12px; text-align: right; }
        .form-group label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 12px; color: #ccc; }
        .form-group input { width: 100%; padding: 8px; border: 1px solid #444; border-radius: 5px; background: #000; color: #fff; font-size: 13px; }
        .btn-login { background: #e67e22; color: #fff; padding: 10px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; font-size: 14px; margin-top: 10px; }

        /* Hero & Layout */
        .hero-section { width: 100%; }
        .hero {
            position: relative; width: 100%; height: 350px;
            background: url('https://i.ibb.co/G4Nv2cYy/photo-2026-10-23-23-06-04.jpg') no-repeat center center/cover;
            transition: background 0.3s ease;
        }
        body.dark-mode .hero { background: url('https://user47700.na.imgto.link/public/20261024/2f01137b93d40e2a72b7462b-photo-2026-10-24-22-21-34.avif') no-repeat center center/cover !important; }
        body.red-mode .hero { background: url('https://user47700.na.imgto.link/public/20261024/fe53bcfc4a8a106ccb41dd79-photo-2026-10-24-22-43-18.avif') no-repeat center center/cover !important; }

        .admin-logout-btn {
            position: absolute; top: 20px; left: 20px; background: #e74c3c; color: #fff; padding: 8px 18px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 13px; z-index: 10; border: none;
        }
        .top-left-controls { position: absolute; top: 20px; left: 130px; display: flex; gap: 10px; z-index: 50; }
        .hero-theme-icon {
            background: rgba(255, 255, 255, 0.9); color: #121212; width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 16px; border: 2px solid #121212;
        }
        body.dark-mode .hero-theme-icon, body.red-mode .hero-theme-icon { background: rgba(0, 0, 0, 0.9); color: #FFFFFF; border-color: #FFFFFF; }

        .theme-dropdown-menu {
            display: none; position: absolute; top: 50px; left: 0; background: #FFFFFF; border: 2px solid #121212; border-radius: 10px; box-shadow: 0 8px 20px rgba(0,0,0,0.2); padding: 5px 0; min-width: 130px; z-index: 100; flex-direction: column;
        }
        body.dark-mode .theme-dropdown-menu, body.red-mode .theme-dropdown-menu { background: #000000; border-color: #FFFFFF; }
        .theme-option { display: flex; align-items: center; gap: 10px; padding: 8px 12px; cursor: pointer; font-size: 13px; font-weight: bold; color: var(--primary-color); }
        .theme-option:hover { background: rgba(0,0,0,0.08); }
        body.dark-mode .theme-option:hover, body.red-mode .theme-option:hover { background: rgba(255,255,255,0.15); }

        .container { max-width: 600px; margin: 30px auto; padding: 0 20px; }
        .products-grid { display: flex; flex-direction: column; gap: 40px; align-items: center; }

        .product-card {
            background: var(--light-color); width: 100%; max-width: 420px;
            display: flex; flex-direction: column; align-items: center;
            padding-bottom: 15px; border-bottom: 1px solid var(--border-color); position: relative;
        }
        body.dark-mode .product-card, body.red-mode .product-card { background: #000000; }
        
        .locked-badge {
            position: absolute; top: 15px; right: 15px; background: #e74c3c; color: #fff;
            padding: 5px 12px; font-size: 12px; font-weight: bold; border-radius: 4px; z-index: 5;
        }

        .image-slider-container {
            position: relative; width: 100%; height: 320px; overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        .product-img { width: 100%; height: 100%; object-fit: contain; display: none; }
        .product-img.active-img { display: block; }

        .card-center-info { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; margin-top: 15px; text-align: center; }
        .card-product-title { font-size: 16px; font-weight: bold; }
        .card-bottom-row { display: flex; align-items: center; justify-content: center; gap: 15px; width: 100%; flex-wrap: wrap; padding: 0 15px; }
        .card-price-tag { font-size: 15px; font-weight: bold; }

        .admin-controls-box {
            background: rgba(0,0,0,0.03); border: 1px solid var(--border-color);
            padding: 10px; border-radius: 8px; width: 100%; margin-top: 10px; display: flex; flex-direction: column; gap: 8px;
        }
        body.dark-mode .admin-controls-box, body.red-mode .admin-controls-box { background: rgba(255,255,255,0.03); }

        .admin-row { display: flex; gap: 8px; align-items: center; justify-content: center; width: 100%; }
        .admin-row input { padding: 5px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; width: 140px; background: #fff; color: #000; }
        body.dark-mode .admin-row input, body.red-mode .admin-row input { background: #111; color: #fff; border-color: #444; }

        .btn {
            background: var(--dark-color); color: #FFFFFF; padding: 6px 14px; border: none; border-radius: 4px;
            font-weight: bold; cursor: pointer; font-size: 12px; display: inline-flex; align-items: center; gap: 5px;
        }
        body.dark-mode .btn, body.red-mode .btn { background: #FFFFFF; color: #000000; }
        .btn-lock { background: #27ae60; color: #fff; }
        .btn-lock.locked { background: #e74c3c; }
        .btn-edit { background: #f39c12; color: #fff; }
        .btn-save { background: #3498db; color: #fff; }
    </style>
</head>
<body>

    <div id="adminLoginScreen">
        <div class="login-box">
            <h3 style="color: #e67e22; margin-bottom: 15px;">چوونە ژوورا ڕێڤەبەری</h3>
            <form onsubmit="adminLogin(event)">
                <div class="form-group">
                    <label>ID:</label>
                    <input type="text" id="adminId" required autocomplete="off" placeholder="ID بنڤیسە">
                </div>
                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" id="adminPass" required autocomplete="new-password" placeholder="ژمارا نهێنی بنڤیسە">
                </div>
                <button type="submit" class="btn-login">چوونە ژوورێ</button>
            </form>
        </div>
    </div>

    <div id="adminStoreView" style="display: none;">
        <div class="hero-section">
            <div class="hero">
                <button class="admin-logout-btn" onclick="location.reload()"><i class="fa-solid fa-right-from-bracket"></i> چوونە دەر</button>
                
                <div class="top-left-controls">
                    <div class="hero-theme-icon" onclick="toggleThemeMenu(event)" title="گۆهۆڕینا مۆدان">
                        <i class="fa-solid fa-palette" id="masterThemeIcon"></i>
                    </div>
                    <div class="theme-dropdown-menu" id="themeDropdownMenu">
                        <div class="theme-option" onclick="setTheme('light')"><i class="fa-solid fa-sun" style="color: #f39c12;"></i> <span>Light Mode</span></div>
                        <div class="theme-option" onclick="setTheme('dark')"><i class="fa-solid fa-moon" style="color: #ffffff;"></i> <span>Dark Mode</span></div>
                        <div class="theme-option" onclick="setTheme('red')"><i class="fa-solid fa-fire" style="color: #ff4d4d;"></i> <span>Red Mode</span></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="container">
            <div class="products-grid" id="product-list">
                <p style="text-align: center; grid-column: 1/-1;">داتایێن دەمژمێران دهێنە بارکرن...</p>
            </div>
        </div>
    </div>

    <script>
        const adminCredentials = { id: "falah", pass: "falah" };
        const sheetCSVUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQUgGUp_uVa2N2S9b3HgLGtTEtBJN5LOb20GfRDO_NVhWq1M1pOVHiyH37rHcLPAGDysRRUmbJvyFw_/pub?output=csv';
        let allProducts = [];

        function toggleThemeMenu(event) {
            event.stopPropagation();
            const menu = document.getElementById('themeDropdownMenu');
            menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
        }

        window.addEventListener('click', function() {
            const menu = document.getElementById('themeDropdownMenu');
            if(menu) menu.style.display = 'none';
        });

        function setTheme(mode) {
            document.body.classList.remove('dark-mode', 'red-mode');
            const masterIcon = document.getElementById('masterThemeIcon');
            if (mode === 'dark') {
                document.body.classList.add('dark-mode');
                masterIcon.className = 'fa-solid fa-moon';
            } else if (mode === 'red') {
                document.body.classList.add('red-mode');
                masterIcon.className = 'fa-solid fa-fire';
            } else {
                masterIcon.className = 'fa-solid fa-sun';
            }
            document.getElementById('themeDropdownMenu').style.display = 'none';
        }

        function adminLogin(event) {
            event.preventDefault();
            const idInput = document.getElementById('adminId').value.trim();
            const passInput = document.getElementById('adminPass').value.trim();

            if (idInput === adminCredentials.id && passInput === adminCredentials.pass) {
                document.getElementById('adminLoginScreen').style.display = 'none';
                document.getElementById('adminStoreView').style.display = 'block';
                fetchSheetData();
            } else {
                alert('خەلەتی د ID یان Password یا ڕێڤەبەری دا هەیە!');
            }
        }

        async function fetchSheetData() {
            try {
                const response = await fetch(sheetCSVUrl);
                const data = await response.text();
                parseCSV(data);
            } catch (error) { console.error('خەلەتی:', error); }
        }

        function parseCSV(text) {
            const lines = text.split('\n');
            allProducts = [];
            
            let savedLocks = JSON.parse(localStorage.getItem('productLocks') || '{}');
            let savedDiscounts = JSON.parse(localStorage.getItem('productDiscounts') || '{}');
            let savedCustomPrices = JSON.parse(localStorage.getItem('productCustomPrices') || '{}');

            for (let i = 1; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line) continue;

                let row = [], inQuotes = false, currentVal = '';
                for (let char of line) {
                    if (char === '"') inQuotes = !inQuotes;
                    else if (char === ',' && !inQuotes) { row.push(currentVal.trim()); currentVal = ''; }
                    else currentVal += char;
                }
                row.push(currentVal.trim());

                if (row.length >= 7) {
                    let pId = i - 1;
                    let originalPrice = row[2].replace(/^"|"$/g, '');
                    let finalActivePrice = savedCustomPrices[pId] !== undefined ? savedCustomPrices[pId] : originalPrice;

                    allProducts.push({
                        id: pId,
                        name: row[0].replace(/^"|"$/g, ''),
                        price: finalActivePrice,
                        originalPrice: originalPrice,
                        imgs: [row[3].replace(/^"|"$/g, ''), row[4].replace(/^"|"$/g, ''), row[5].replace(/^"|"$/g, '')].filter(img => img !== ''),
                        isLocked: savedLocks[pId] !== undefined ? savedLocks[pId] : false,
                        discountVal: savedDiscounts[pId] !== undefined ? savedDiscounts[pId] : ''
                    });
                }
            }
            displayAdminProducts();
        }

        function displayAdminProducts() {
            const productListContainer = document.getElementById('product-list');
            productListContainer.innerHTML = '';
            if(allProducts.length === 0) {
                productListContainer.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #aaa;">چ دەمژمێر نینن.</p>';
                return;
            }

            allProducts.forEach((product) => {
                const card = document.createElement('div');
                card.className = 'product-card';
                
                let lockBadgeHTML = product.isLocked ? `<div class="locked-badge"><i class="fa-solid fa-lock"></i> قفلكرییە</div>` : '';
                let imagesHTML = '';
                product.imgs.forEach((imgUrl, imgIdx) => {
                    imagesHTML += `<img src="${imgUrl}" class="product-img ${imgIdx === 0 ? 'active-img' : ''}" alt="Watch">`;
                });
                if(product.imgs.length === 0) imagesHTML = `<img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80" class="product-img active-img">`;

                let finalPriceStr = product.price;
                let displayPriceHTML = `<div class="card-price-tag">نرخ: ${product.price}</div>`;
                let rawPriceNum = parseFloat(product.price.replace(/[^0-9.]/g, '')) || 0;

                if (product.discountVal) {
                    let calculatedNum = rawPriceNum;
                    if (product.discountVal.includes('%')) {
                        calculatedNum = rawPriceNum - (rawPriceNum * (parseFloat(product.discountVal) / 100));
                        finalPriceStr = calculatedNum.toLocaleString() + ' د.ع';
                    } else if (rawPriceNum > 0) {
                        calculatedNum = rawPriceNum - (parseFloat(product.discountVal) || 0);
                        finalPriceStr = calculatedNum.toLocaleString() + ' د.ع';
                    }
                    displayPriceHTML = `
                        <div class="card-price-tag">
                            <span style="text-decoration: line-through; color: #888; font-size: 13px; margin-left: 8px;">${product.price}</span>
                            <span style="color: #e74c3c;">${finalPriceStr}</span>
                        </div>
                    `;
                }

                card.innerHTML = `
                    ${lockBadgeHTML}
                    <div class="image-slider-container">${imagesHTML}</div>
                    <div class="card-center-info">
                        <div class="card-product-title">${product.name}</div>
                        <div class="card-bottom-row">${displayPriceHTML}</div>
                        <div class="admin-controls-box">
                            <div class="admin-row">
                                <input type="text" id="edit-price-${product.id}" value="${product.price}" placeholder="بهایێ نوو">
                                <button class="btn btn-edit" onclick="updatePrice(${product.id})"><i class="fa-solid fa-pen"></i> Edit بها</button>
                            </div>
                            <div class="admin-row">
                                <input type="text" id="disc-${product.id}" value="${product.discountVal}" placeholder="داشکاندن (مثال: 10% یا 5000)">
                                <button class="btn btn-save" onclick="saveDiscount(${product.id})">دانان</button>
                                <button class="btn btn-lock ${product.isLocked ? 'locked' : ''}" onclick="toggleLock(${product.id})">
                                    ${product.isLocked ? '<i class="fa-solid fa-lock"></i> قفلە' : '<i class="fa-solid fa-lock-open"></i> ڤەکرییە'}
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                productListContainer.appendChild(card);
            });
        }

        function toggleLock(productId) {
            let product = allProducts.find(p => p.id === productId);
            if (!product) return;
            product.isLocked = !product.isLocked;
            let savedLocks = JSON.parse(localStorage.getItem('productLocks') || '{}');
            savedLocks[productId] = product.isLocked;
            localStorage.setItem('productLocks', JSON.stringify(savedLocks));
            displayAdminProducts();
        }

        function saveDiscount(productId) {
            let val = document.getElementById(`disc-${productId}`).value.trim();
            let product = allProducts.find(p => p.id === productId);
            if (!product) return;
            product.discountVal = val;
            let savedDiscounts = JSON.parse(localStorage.getItem('productDiscounts') || '{}');
            savedDiscounts[productId] = val;
            localStorage.setItem('productDiscounts', JSON.stringify(savedDiscounts));
            alert('داشکاندن ب سەرکەفتی هاتە نووکرن!');
            displayAdminProducts();
        }

        function updatePrice(productId) {
            let newPriceVal = document.getElementById(`edit-price-${productId}`).value.trim();
            if (!newPriceVal) return;
            let product = allProducts.find(p => p.id === productId);
            if (!product) return;
            product.price = newPriceVal;
            let savedCustomPrices = JSON.parse(localStorage.getItem('productCustomPrices') || '{}');
            savedCustomPrices[productId] = newPriceVal;
            localStorage.setItem('productCustomPrices', JSON.stringify(savedCustomPrices));
            alert('بهایێ بەرهەمی ب سەرکەفتی هاتە گۆهۆڕین (Edit بوو)!');
            displayAdminProducts();
        }
    </script>
</body>
</html>
