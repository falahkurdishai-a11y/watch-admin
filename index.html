<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جیهانا دەمژمێران | Watch Store</title>
    <!-- FontAwesome بۆ ئایکۆنان -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #333333;
            --dark-color: #121212;
            --light-color: #FFFFFF;
            --gray-color: #555555;
            --card-bg: #FFFFFF;
            --border-color: #f0f0f0;
        }

        /* Dark Mode & Red Mode Variables (ڕەشێ تەمام #000000) */
        body.dark-mode, body.red-mode {
            --primary-color: #FFFFFF;
            --dark-color: #FFFFFF;
            --light-color: #000000;
            --gray-color: #AAAAAA;
            --card-bg: #000000;
            --border-color: #222222;
            background-color: #000000 !important;
            color: #FFFFFF !important;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; outline: none; transition: background-color 0.3s, color 0.3s; }
        body { background-color: var(--light-color); color: var(--primary-color); line-height: 1.6; margin: 0; padding: 0; }

        /* Hero Section */
        .hero-section {
            background-color: #FFFFFF;
            padding: 0;
            width: 100%;
            margin: 0;
            border: none;
        }
        body.dark-mode .hero-section, body.red-mode .hero-section {
            background-color: #000000;
        }

        .hero {
            position: relative;
            width: 100%;
            height: 380px;
            background: url('https://i.ibb.co/G4Nv2cYy/photo-2026-10-23-23-06-04.jpg') no-repeat center center/cover;
            border-radius: 0;
            overflow: hidden;
            box-shadow: none;
            border: none;
            margin: 0;
            transition: background 0.3s ease;
        }

        body.dark-mode .hero {
            background: url('https://user47700.na.imgto.link/public/20261024/2f01137b93d40e2a72b7462b-photo-2026-10-24-22-21-34.avif') no-repeat center center/cover !important;
        }

        body.red-mode .hero {
            background: url('https://user47700.na.imgto.link/public/20261024/fe53bcfc4a8a106ccb41dd79-photo-2026-10-24-22-43-18.avif') no-repeat center center/cover !important;
        }

        /* ئایکۆنا سەلکێ ل ڕەخێ چەپی ل سەر وێنەیێ سەرەکی */
        .hero-cart-icon {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            color: #121212;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 10;
            transition: 0.3s;
            font-size: 20px;
            border: 2px solid #121212;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        body.dark-mode .hero-cart-icon, body.red-mode .hero-cart-icon {
            background: rgba(0, 0, 0, 0.9);
            color: #FFFFFF;
            border-color: #FFFFFF;
        }
        .hero-cart-icon:hover {
            background: var(--dark-color);
            color: var(--light-color);
        }
        body.dark-mode .hero-cart-icon:hover, body.red-mode .hero-cart-icon:hover {
            background: #FFFFFF;
            color: #000000;
        }

        .hero-cart-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: red;
            color: white;
            border-radius: 50%;
            padding: 2px 7px;
            font-size: 11px;
            font-weight: bold;
        }

        /* ئایکۆنا مۆدان ل ڕەخێ چەپ */
        .top-left-controls {
            position: absolute;
            top: 20px;
            left: 80px;
            display: flex;
            gap: 10px;
            z-index: 50;
        }

        .hero-theme-icon {
            background: rgba(255, 255, 255, 0.9);
            color: #121212;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.3s;
            font-size: 20px;
            border: 2px solid #121212;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        body.dark-mode .hero-theme-icon, body.red-mode .hero-theme-icon {
            background: rgba(0, 0, 0, 0.9);
            color: #FFFFFF;
            border-color: #FFFFFF;
        }
        .hero-theme-icon:hover {
            background: var(--dark-color);
            color: var(--light-color);
        }
        body.dark-mode .hero-theme-icon:hover, body.red-mode .hero-theme-icon:hover {
            background: #FFFFFF;
            color: #000000;
        }

        .theme-dropdown-menu {
            display: none;
            position: absolute;
            top: 60px;
            left: 0;
            background: #FFFFFF;
            border: 2px solid #121212;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            padding: 8px 0;
            min-width: 150px;
            z-index: 100;
            flex-direction: column;
        }
        body.dark-mode .theme-dropdown-menu, body.red-mode .theme-dropdown-menu {
            background: #000000;
            border-color: #FFFFFF;
        }

        .theme-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            color: var(--primary-color);
            transition: 0.2s;
        }
        .theme-option:hover { background: rgba(0,0,0,0.08); }
        body.dark-mode .theme-option:hover, body.red-mode .theme-option:hover { background: rgba(255,255,255,0.15); }

        .container { 
            max-width: 600px; 
            margin: 30px auto; 
            padding: 0 20px; 
            background-color: #FFFFFF;
        }
        body.dark-mode .container, body.red-mode .container { background-color: #000000; }
        
        .category-filters {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: #FFFFFF;
            border: 2px solid var(--dark-color);
            color: var(--primary-color);
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: 0.3s;
        }
        body.dark-mode .filter-btn, body.red-mode .filter-btn {
            background: #000000;
            border: 2px solid #FFFFFF;
            color: #FFFFFF;
        }
        .filter-btn:hover, .filter-btn.active {
            background: var(--dark-color);
            color: #FFFFFF;
        }
        body.dark-mode .filter-btn:hover, body.dark-mode .filter-btn.active,
        body.red-mode .filter-btn:hover, body.red-mode .filter-btn.active {
            background: #FFFFFF;
            color: #000000;
        }

        .products-grid {
            display: flex;
            flex-direction: column;
            gap: 40px;
            align-items: center;
        }

        .product-card {
            background: #FFFFFF;
            border-radius: 0; 
            overflow: hidden;
            box-shadow: none; 
            transition: 0.3s;
            color: var(--primary-color);
            width: 100%;
            max-width: 420px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            border: none;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }
        body.dark-mode .product-card, body.red-mode .product-card { background: #000000; }
        
        .locked-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #e74c3c;
            color: #fff;
            padding: 5px 12px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            z-index: 5;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .image-slider-container {
            position: relative;
            width: 100%;
            height: 320px; 
            background: #FFFFFF;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            touch-action: pan-y;
        }
        body.dark-mode .image-slider-container, body.red-mode .image-slider-container { background: #000000; }
        
        .product-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
            border: none;
            transition: transform 0.5s ease;
        }
        .product-img.active-img { display: block; }
        .image-slider-container:hover .product-img.active-img { transform: scale(1.08); }

        .card-center-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
            margin-top: 15px;
            text-align: center;
        }

        .card-product-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--primary-color);
        }

        .card-bottom-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
        }

        .card-price-tag {
            font-size: 15px;
            font-weight: bold;
            color: var(--primary-color);
        }

        .card-plus-btn {
            background: #FFFFFF;
            color: #121212;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid #121212;
        }
        body.dark-mode .card-plus-btn, body.red-mode .card-plus-btn {
            background: #000000;
            color: #FFFFFF;
            border: 1px solid #FFFFFF;
        }
        .card-plus-btn:hover { background: var(--dark-color); color: #FFFFFF; }
        body.dark-mode .card-plus-btn:hover, body.red-mode .card-plus-btn:hover { background: #FFFFFF; color: #000000; }

        .btn {
            background: var(--dark-color); 
            color: #FFFFFF;
            padding: 10px 20px; border: none; border-radius: 5px;
            font-weight: bold; cursor: pointer; text-decoration: none; transition: 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
        }
        body.dark-mode .btn, body.red-mode .btn { background: #FFFFFF; color: #000000; }
        .btn:hover { opacity: 0.9; }

        /* Full Screen Modal Styles */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); justify-content: center; align-items: center; overflow: hidden; }
        .modal-content { background: #FFFFFF; color: var(--primary-color); padding: 20px 30px; width: 100%; max-width: 550px; position: relative; text-align: right; display: flex; flex-direction: column; justify-content: center; height: 100%; margin: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        body.dark-mode .modal-content, body.red-mode .modal-content { background: #000000; }
        
        .close-btn { position: absolute; top: 20px; left: 25px; font-size: 28px; cursor: pointer; color: var(--primary-color); font-weight: bold; z-index: 1010; background: #FFFFFF; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.3s; border: 1px solid #ddd; }
        body.dark-mode .close-btn, body.red-mode .close-btn { background: #000000; color: #FFFFFF; border-color: #444; }
        .close-btn:hover { background: var(--dark-color); color: #FFFFFF; }
        
        .modal-slider-box {
            position: relative;
            width: 100%;
            height: 280px;
            background: #FFFFFF;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            border: none;
            touch-action: pan-y;
        }
        body.dark-mode .modal-slider-box, body.red-mode .modal-slider-box { background: #000000; }
        .modal-img { width: 100%; height: 100%; object-fit: contain; display: none; border: none; }
        .modal-img.active-modal-img { display: block; }
        
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding: 12px 0;
            font-size: 14px;
        }
        .qty-controls { display: flex; align-items: center; gap: 8px; margin: 0 10px; }
        .qty-btn {
            background: #FFFFFF; border: 1px solid #ccc; width: 25px; height: 25px; font-weight: bold; cursor: pointer; border-radius: 3px; color: #121212;
        }
        body.dark-mode .qty-btn, body.red-mode .qty-btn { background: #000000; border-color: #444; color: #FFFFFF; }
        .qty-btn:hover { background: var(--dark-color); color: #FFFFFF; }

        .cart-total {
            font-size: 15px; font-weight: bold; margin: 10px 0; text-align: left; color: var(--primary-color); line-height: 1.5;
        }

        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; margin-bottom: 3px; font-weight: bold; color: var(--primary-color); font-size: 13px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 7px; border: 1px solid #ccc; border-radius: 5px; background: #FFFFFF; color: var(--primary-color); font-size: 13px; }
        body.dark-mode .form-group input, body.dark-mode .form-group textarea, body.dark-mode .form-group select,
        body.red-mode .form-group input, body.red-mode .form-group textarea, body.red-mode .form-group select { background: #000000; border-color: #333333; color: #FFFFFF; }

        footer { 
            background: #FFFFFF; color: var(--primary-color); text-align: center; padding: 35px 20px; margin-top: 50px; border-top: 1px solid var(--border-color); font-size: 16px;
        }
        body.dark-mode footer, body.red-mode footer { background: #000000; }
    </style>
</head>
<body>

    <!-- Hero Section -->
    <div class="hero-section">
        <div class="hero">
            <!-- ئایکۆنا سەلکێ -->
            <div class="hero-cart-icon" onclick="openCartModal()" title="سەلکا من">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="hero-cart-badge" id="cartCount">0</span>
            </div>
            
            <!-- ئایکۆنا مۆدان -->
            <div class="top-left-controls">
                <div class="hero-theme-icon" onclick="toggleThemeMenu(event)" title="گۆهۆڕینا مۆدان">
                    <i class="fa-solid fa-palette" id="masterThemeIcon"></i>
                </div>
                <div class="theme-dropdown-menu" id="themeDropdownMenu">
                    <div class="theme-option" onclick="setTheme('light')">
                        <i class="fa-solid fa-sun" style="color: #f39c12;"></i> <span>Light Mode</span>
                    </div>
                    <div class="theme-option" onclick="setTheme('dark')">
                        <i class="fa-solid fa-moon" style="color: #ffffff;"></i> <span>Dark Mode</span>
                    </div>
                    <div class="theme-option" onclick="setTheme('red')">
                        <i class="fa-solid fa-fire" style="color: #ff4d4d;"></i> <span>Red Mode</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="category-filters" id="filter-buttons">
            <button class="filter-btn active" onclick="filterProducts('all', this)">هەمی دەمژمێر</button>
        </div>

        <div class="products-grid" id="product-list">
            <p style="text-align: center; grid-column: 1/-1;">داتایێن دەمژمێران دهێنە بارکرن ژ Google Sheets...</p>
        </div>
    </div>

    <!-- Product Modal -->
    <div class="modal" id="productModal">
        <div class="modal-content" id="productModalContent"></div>
    </div>

    <!-- Cart Modal -->
    <div class="modal" id="cartModal">
        <div class="modal-content" style="height: auto; min-height: auto; border-radius: 10px; border: 2px solid var(--primary-color); max-width: 500px; max-height: 90vh; overflow-y: auto;">
            <span class="close-btn" onclick="closeCartModal()">&times;</span>
            <h2>سەلکا خڕکردنێ</h2>
            
            <div id="cartItemsList" style="margin-top: 15px;">
                <p style="text-align: center; color: var(--gray-color);">سەلکا تە یا ڤalایە.</p>
            </div>

            <div class="cart-total" id="cartTotalPrice" style="display: none;"></div>

            <button class="btn" id="showOrderOptionsBtn" onclick="showOrderOptions()" style="width: 100%; display: none; margin-top: 15px;">داخاز بکە</button>

            <div id="orderTypeSelection" style="display: none; margin-top: 15px; gap: 10px;">
                <p style="font-weight: bold; margin-bottom: 8px; text-align: center;">جۆرێ داخازێ هەڵبژێرە:</p>
                <div style="display: flex; gap: 10px;">
                    <button class="btn" style="flex: 1; background: #27ae60; color: #fff;" onclick="selectOrderType('personal')">بۆ خۆ</button>
                    <button class="btn" style="flex: 1; background: #e67e22; color: #fff;" onclick="selectOrderType('commercial')">بۆ تجارەتی</button>
                </div>
            </div>

            <form id="personalForm" onsubmit="submitPersonalOrder(event)" style="display: none; margin-top: 15px;">
                <hr style="margin-bottom: 12px; border: 0; border-top: 1px solid var(--border-color);">
                <h3 style="font-size: 15px; margin-bottom: 10px; color: #27ae60;">داخازا بۆ خۆ (شەخسی)</h3>
                <div class="form-group">
                    <label>نافێ تە:</label>
                    <input type="text" id="pName" required placeholder="ناڤێ تە یێ تەمام">
                </div>
                <div class="form-group">
                    <label>ژمارا مۆبایلێ:</label>
                    <input type="tel" id="pPhone" required placeholder="0750XXXXXXX">
                </div>
                <div class="form-group">
                    <label>شار (جهێ گەهاندنێ):</label>
                    <select id="pCity" onchange="renderCartItems()" required>
                        <option value="" disabled selected>شارەکێ هەڵبژێرە</option>
                        <option value="زاخۆ" data-fee="2000">زاخۆ (بهایێ گەهاندنێ: 2,000 د.ع)</option>
                        <option value="دهۆک" data-fee="4000">دهۆک (بهایێ گەهاندنێ: 4,000 د.ع)</option>
                        <option value="سێمێل" data-fee="3000">سێمێل (بهایێ گەهاندنێ: 3,000 د.ع)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>نیشانگەهـ (ناڤونیشان):</label>
                    <textarea id="pAddress" rows="2" required placeholder="کۆڵان، نزیک..."></textarea>
                </div>
                <button type="submit" class="btn" style="width: 100%; margin-top: 5px;">ناردنا داخازێ</button>
            </form>

            <form id="commercialForm" onsubmit="submitCommercialOrder(event)" style="display: none; margin-top: 15px;">
                <hr style="margin-bottom: 12px; border: 0; border-top: 1px solid var(--border-color);">
                <h3 style="font-size: 15px; margin-bottom: 10px; color: #e67e22;">داخازا تجارەتی</h3>
                <div class="form-group">
                    <label>نافێ داخازکەری (تە):</label>
                    <input type="text" id="cRequester" required placeholder="ناڤێ خۆ">
                </div>
                <div class="form-group">
                    <label>نافێ وەرگری (کەسێ تیلیبی بۆچی):</label>
                    <input type="text" id="cReceiver" required placeholder="ناڤێ وەرگری">
                </div>
                <div class="form-group">
                    <label>ژمارا مۆبایلا وەرگری:</label>
                    <input type="tel" id="cReceiverPhone" required placeholder="0750XXXXXXX">
                </div>
                <div class="form-group">
                    <label>شار (جهێ گەهاندنێ بۆ وەرگری):</label>
                    <select id="cCity" onchange="renderCartItems()" required>
                        <option value="" disabled selected>شارەکێ هەڵبژێرە</option>
                        <option value="زاخۆ" data-fee="2000">زاخۆ (بهایێ گەهاندنێ: 2,000 د.ع)</option>
                        <option value="دهۆک" data-fee="4000">دهۆک (بهایێ گەهاندنێ: 4,000 د.ع)</option>
                        <option value="سێمێل" data-fee="3000">سێمێل (بهایێ گەهاندنێ: 3,000 د.ع)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>ناڤونیشانیت وەرگری:</label>
                    <textarea id="cReceiverAddress" rows="2" required placeholder="کۆڵان، نزیک..."></textarea>
                </div>
                <div class="form-group">
                    <label>چەند فايدة بخو هاڤیتە سەر (دينار یان %):</label>
                    <input type="text" id="cProfit" required placeholder="بڕێ فایدەی (مثال: 25,000 IQD یا 10%)">
                </div>
                <button type="submit" class="btn" style="width: 100%; margin-top: 5px;">ناردنا داخازێ</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 هەمی ماف پارێزراوین.</p>
    </footer>

    <script>
        const sheetCSVUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQUgGUp_uVa2N2S9b3HgLGtTEtBJN5LOb20GfRDO_NVhWq1M1pOVHiyH37rHcLPAGDysRRUmbJvyFw_/pub?output=csv';

        let allProducts = [];
        let availableBrands = new Set(['all']);
        let cart = [];
        let currentFilterBrand = 'all';

        function toggleThemeMenu(event) {
            event.stopPropagation();
            const menu = document.getElementById('themeDropdownMenu');
            menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
        }

        window.addEventListener('click', function() {
            const menu = document.getElementById('themeDropdownMenu');
            if(menu) menu.style.display = 'none';
        });

        function setTheme(mode) {
            document.body.classList.remove('dark-mode', 'red-mode');
            const masterIcon = document.getElementById('masterThemeIcon');
            
            if (mode === 'dark') {
                document.body.classList.add('dark-mode');
                masterIcon.className = 'fa-solid fa-moon';
            } else if (mode === 'red') {
                document.body.classList.add('red-mode');
                masterIcon.className = 'fa-solid fa-fire';
            } else {
                masterIcon.className = 'fa-solid fa-sun';
            }
            document.getElementById('themeDropdownMenu').style.display = 'none';
        }

        async function fetchSheetData() {
            try {
                const response = await fetch(sheetCSVUrl);
                const data = await response.text();
                parseCSV(data);
            } catch (error) {
                console.error('خەلەتی:', error);
                document.getElementById('product-list').innerHTML = '<p style="text-align: center; color: red; grid-column: 1/-1;">خەلەتی د ڤەکولینا داتایێن شیتی دا چێبوو.</p>';
            }
        }

        function parseCSV(text) {
            const lines = text.split('\n');
            allProducts = [];
            
            let savedLocks = JSON.parse(localStorage.getItem('productLocks') || '{}');
            let savedDiscounts = JSON.parse(localStorage.getItem('productDiscounts') || '{}');

            for (let i = 1; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line) continue;

                let row = [];
                let inQuotes = false;
                let currentVal = '';
                
                for (let char of line) {
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        row.push(currentVal.trim());
                        currentVal = '';
                    } else {
                        currentVal += char;
                    }
                }
                row.push(currentVal.trim());

                if (row.length >= 7) {
                    let pId = i - 1;
                    const product = {
                        id: pId,
                        name: row[0].replace(/^"|"$/g, ''),
                        brand: row[1].toLowerCase().replace(/^"|"$/g, ''),
                        price: row[2].replace(/^"|"$/g, ''),
                        imgs: [
                            row[3].replace(/^"|"$/g, ''),
                            row[4].replace(/^"|"$/g, ''),
                            row[5].replace(/^"|"$/g, '')
                        ].filter(img => img !== ''),
                        desc: row[6].replace(/^"|"$/g, ''),
                        isLocked: savedLocks[pId] !== undefined ? savedLocks[pId] : false,
                        discountVal: savedDiscounts[pId] !== undefined ? savedDiscounts[pId] : ''
                    };
                    
                    if (product.name) {
                        allProducts.push(product);
                        availableBrands.add(product.brand);
                    }
                }
            }

            buildFilterButtons();
            filterProducts(currentFilterBrand, document.querySelector('.filter-btn'));
        }

        function buildFilterButtons() {
            const filterContainer = document.getElementById('filter-buttons');
            filterContainer.innerHTML = `<button class="filter-btn active" onclick="filterProducts('all', this)">هەمی دەمژمێر</button>`;

            availableBrands.forEach(brand => {
                if (brand !== 'all') {
                    let btn = document.createElement('button');
                    btn.className = 'filter-btn';
                    btn.setAttribute('onclick', `filterProducts('${brand}', this)`);
                    btn.innerText = brand.toUpperCase();
                    filterContainer.appendChild(btn);
                }
            });
        }

        const productListContainer = document.getElementById('product-list');

        function displayProducts(filteredProducts) {
            productListContainer.innerHTML = '';
            if(filteredProducts.length === 0) {
                productListContainer.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #aaa;">چ دەمژمێر د ڤی بەشی دا نینن.</p>';
                return;
            }

            filteredProducts.forEach((product) => {
                const card = document.createElement('div');
                card.className = 'product-card';
                
                let lockBadgeHTML = product.isLocked ? `<div class="locked-badge"><i class="fa-solid fa-lock"></i> قفلكرییە</div>` : '';

                let imagesHTML = '';
                product.imgs.forEach((imgUrl, imgIdx) => {
                    let activeClass = imgIdx === 0 ? 'active-img' : '';
                    imagesHTML += `<img src="${imgUrl}" class="product-img ${activeClass}" alt="Watch">`;
                });

                if(product.imgs.length === 0) {
                    imagesHTML = `<img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80" class="product-img active-img">`;
                }

                // حسابکرنا نرخێ نهایێ ب داشکاندن
                let finalPriceStr = product.price;
                let displayPriceHTML = `<div class="card-price-tag">${product.price}</div>`;
                let rawPriceNum = parseFloat(product.price.replace(/[^0-9.]/g, '')) || 0;

                if (product.discountVal) {
                    finalPriceStr = product.discountVal;
                    let calculatedNum = rawPriceNum;
                    if (product.discountVal.includes('%')) {
                        let percent = parseFloat(product.discountVal) || 0;
                        calculatedNum = rawPriceNum - (rawPriceNum * (percent / 100));
                        finalPriceStr = calculatedNum.toLocaleString() + ' د.ع';
                    } else if (rawPriceNum > 0) {
                        let discNum = parseFloat(product.discountVal) || 0;
                        calculatedNum = rawPriceNum - discNum;
                        finalPriceStr = calculatedNum.toLocaleString() + ' د.ع';
                    }

                    displayPriceHTML = `
                        <div class="card-price-tag">
                            <span style="text-decoration: line-through; color: #888; font-size: 13px; margin-left: 8px;">${product.price}</span>
                            <span style="color: #e74c3c;">${finalPriceStr}</span>
                        </div>
                    `;
                }

                let plusBtnHTML = `
                    <div class="card-plus-btn" onclick="event.stopPropagation(); addToCart(${product.id}, '${finalPriceStr}')" title="زێدەکرن بۆ سەلکێ">
                        <i class="fa-solid fa-plus"></i>
                    </div>
                `;
                if (product.isLocked) {
                    plusBtnHTML = `<span style="font-size: 12px; color: #e74c3c; font-weight: bold;">بەردەست نینە</span>`;
                }

                card.innerHTML = `
                    ${lockBadgeHTML}
                    <div class="image-slider-container" id="slider-${product.id}" 
                         ontouchstart="window.touchStartX_${product.id} = event.touches[0].clientX" 
                         ontouchend="let endX = event.changedTouches[0].clientX; if(window.touchStartX_${product.id} - endX > 40) changeCardImage(${product.id}, 1); else if(endX - window.touchStartX_${product.id} > 40) changeCardImage(${product.id}, -1);"
                         onclick="openProductModal(${product.id})" title="کلیک بکە بۆ دیتیڤایێن دەمژمێرێ">
                        ${imagesHTML}
                    </div>
                    <div class="card-center-info">
                        <div class="card-product-title">${product.name}</div>
                        <div class="card-bottom-row">
                            ${displayPriceHTML}
                            ${plusBtnHTML}
                        </div>
                    </div>
                `;
                productListContainer.appendChild(card);
            });
        }

        function changeCardImage(productId, direction) {
            const sliderContainer = document.getElementById(`slider-${productId}`);
            if(!sliderContainer) return;
            const images = sliderContainer.querySelectorAll('.product-img');
            let currentIndex = 0;

            images.forEach((img, idx) => {
                if (img.classList.contains('active-img')) {
                    currentIndex = idx;
                    img.classList.remove('active-img');
                }
            });

            let newIndex = currentIndex + direction;
            if (newIndex >= images.length) {
                newIndex = 0;
            } else if (newIndex < 0) {
                newIndex = images.length - 1;
            }

            images[newIndex].classList.add('active-img');
        }

        function openProductModal(productId) {
            const product = allProducts.find(p => p.id === productId);
            if(!product) return;
            const modalContent = document.getElementById('productModalContent');
            
            let modalImagesHTML = '';
            product.imgs.forEach((imgUrl, imgIdx) => {
                let activeClass = imgIdx === 0 ? 'active-modal-img' : '';
                modalImagesHTML += `<img src="${imgUrl}" class="modal-img ${activeClass}" alt="Watch">`;
            });

            if(product.imgs.length === 0) {
                modalImagesHTML = `<img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80" class="modal-img active-modal-img" alt="Watch">`;
            }

            let finalPriceStr = product.price;
            let rawPriceNum = parseFloat(product.price.replace(/[^0-9.]/g, '')) || 0;
            if (product.discountVal) {
                finalPriceStr = product.discountVal;
                if (product.discountVal.includes('%')) {
                    let percent = parseFloat(product.discountVal) || 0;
                    let calculatedNum = rawPriceNum - (rawPriceNum * (percent / 100));
                    finalPriceStr = calculatedNum.toLocaleString() + ' د.ع';
                } else if (rawPriceNum > 0) {
                    let discNum = parseFloat(product.discountVal) || 0;
                    let calculatedNum = rawPriceNum - discNum;
                    finalPriceStr = calculatedNum.toLocaleString() + ' د.ع';
                }
            }

            let addToCartBtnHTML = `
                <button class="btn" style="width: 100%;" onclick="addFromModal(${product.id}, '${finalPriceStr}')">
                    <i class="fa-solid fa-cart-shopping"></i> زێدە کەر بۆ سەلکێ
                </button>
            `;
            if (product.isLocked) {
                addToCartBtnHTML = `<div style="text-align: center; color: #e74c3c; font-weight: bold; padding: 10px;">ئەڤ بەرهەمە قفلكرییە و نەماوە</div>`;
            }

            modalContent.innerHTML = `
                <span class="close-btn" onclick="closeProductModal()">&times;</span>
                
                <div class="modal-slider-box" id="modalSlider"
                     ontouchstart="window.modalTouchStartX = event.touches[0].clientX"
                     ontouchend="let endX = event.changedTouches[0].clientX; if(window.modalTouchStartX - endX > 40) changeModalImage(1); else if(endX - window.modalTouchStartX > 40) changeModalImage(-1);">
                    ${modalImagesHTML}
                </div>

                <h2 style="font-size: 22px; margin-bottom: 4px; text-align: center;">${product.name}</h2>
                <div style="font-size: 13px; font-weight: bold; text-transform: uppercase; margin-bottom: 8px; text-align: center;">مارکە: ${product.brand}</div>
                <p style="font-size: 13px; color: var(--gray-color); margin-bottom: 8px; line-height: 1.4; text-align: center;"><b>تێبینی:</b> ${product.desc}</p>
                <div style="font-size: 18px; font-weight: bold; margin-bottom: 15px; text-align: center;">نرخ: ${finalPriceStr}</div>

                ${addToCartBtnHTML}
            `;

            document.getElementById('productModal').style.display = 'flex';
        }

        function changeModalImage(direction) {
            const sliderBox = document.getElementById('modalSlider');
            if(!sliderBox) return;
            const images = sliderBox.querySelectorAll('.modal-img');
            let currentIndex = 0;

            images.forEach((img, idx) => {
                if (img.classList.contains('active-modal-img')) {
                    currentIndex = idx;
                    img.classList.remove('active-modal-img');
                }
            });

            let newIndex = currentIndex + direction;
            if (newIndex >= images.length) {
                newIndex = 0;
            } else if (newIndex < 0) {
                newIndex = images.length - 1;
            }

            images[newIndex].classList.add('active-modal-img');
        }

        function closeProductModal() { document.getElementById('productModal').style.display = 'none'; }
        function addFromModal(productId, priceStr) { addToCart(productId, priceStr); closeProductModal(); }

        function filterProducts(brand, buttonElement) {
            currentFilterBrand = brand;
            if (buttonElement) {
                document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                buttonElement.classList.add('active');
            }

            if (brand === 'all') {
                displayProducts(allProducts);
            } else {
                const filtered = allProducts.filter(p => p.brand === brand);
                displayProducts(filtered);
            }
        }

        function addToCart(productId, finalPriceStr) {
            let product = allProducts.find(p => p.id === productId);
            if (!product || product.isLocked) return;

            let existingItem = cart.find(item => item.id === productId);
            if (existingItem) {
                existingItem.qty += 1;
            } else {
                cart.push({ id: product.id, name: product.name, price: finalPriceStr, qty: 1 });
            }
            updateCartCount();
            alert(`(${product.name}) ب سەرکەفتی هاتە زێدەکرن بۆ سەلکا تە!`);
        }

        function updateCartCount() {
            let totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cartCount').innerText = totalCount;
        }

        const cartModal = document.getElementById('cartModal');
        
        function openCartModal() {
            renderCartItems();
            document.getElementById('orderTypeSelection').style.display = 'none';
            document.getElementById('personalForm').style.display = 'none';
            document.getElementById('commercialForm').style.display = 'none';
            cartModal.style.display = 'flex';
        }

        function renderCartItems() {
            const cartItemsList = document.getElementById('cartItemsList');
            const showOrderOptionsBtn = document.getElementById('showOrderOptionsBtn');
            const cartTotalPrice = document.getElementById('cartTotalPrice');

            cartItemsList.innerHTML = '';

            if (cart.length === 0) {
                cartItemsList.innerHTML = '<p style="text-align: center; color: var(--gray-color);">سەلکا تە یا ڤalایە.</p>';
                showOrderOptionsBtn.style.display = 'none';
                cartTotalPrice.style.display = 'none';
                document.getElementById('orderTypeSelection').style.display = 'none';
                document.getElementById('personalForm').style.display = 'none';
                document.getElementById('commercialForm').style.display = 'none';
            } else {
                let subtotal = 0;
                cart.forEach((item, idx) => {
                    let numericPrice = parseFloat(item.price.replace(/[^0-9.]/g, '')) || 0;
                    let itemTotal = numericPrice * item.qty;
                    subtotal += itemTotal;

                    cartItemsList.innerHTML += `
                        <div class="cart-item">
                            <div>
                                <b style="color: var(--primary-color);">${item.name}</b><br>
                                <span style="font-size: 12px; color: var(--gray-color);">${item.price} × ${item.qty} = ${itemTotal.toLocaleString()} د.ع</span>
                            </div>
                            <div style="display: flex; align-items: center;">
                                <div class="qty-controls">
                                    <button class="qty-btn" onclick="changeQty(${idx}, -1)">-</button>
                                    <span style="color: var(--primary-color); font-weight: bold;">${item.qty}</span>
                                    <button class="qty-btn" onclick="changeQty(${idx}, 1)">+</button>
                                </div>
                                <i class="fa-solid fa-trash" style="color: #ff6b6b; cursor:pointer; margin-right:8px;" onclick="removeFromCart(${idx})"></i>
                            </div>
                        </div>
                    `;
                });

                let deliveryFee = 0;
                const pCity = document.getElementById('pCity');
                const cCity = document.getElementById('cCity');
                
                if (document.getElementById('personalForm').style.display === 'block' && pCity && pCity.selectedOptions[0]) {
                    deliveryFee = parseFloat(pCity.selectedOptions[0].getAttribute('data-fee')) || 0;
                } else if (document.getElementById('commercialForm').style.display === 'block' && cCity && cCity.selectedOptions[0]) {
                    deliveryFee = parseFloat(cCity.selectedOptions[0].getAttribute('data-fee')) || 0;
                }

                let grandTotal = subtotal + deliveryFee;

                cartTotalPrice.style.display = 'block';
                cartTotalPrice.innerHTML = `
                    نرخێ بەرهەمان: ${subtotal.toLocaleString()} د.ع<br>
                    بهایێ گەهاندنێ: ${deliveryFee.toLocaleString()} د.ع<br>
                    <span style="font-size: 17px; color: #27ae60;">کۆی گشتی: ${grandTotal.toLocaleString()} دينار</span>
                `;
                showOrderOptionsBtn.style.display = 'block';
            }
        }

        function changeQty(index, change) {
            cart[index].qty += change;
            if (cart[index].qty <= 0) {
                cart.splice(index, 1);
            }
            updateCartCount();
            renderCartItems();
        }

        function closeCartModal() { cartModal.style.display = 'none'; }
        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartCount();
            renderCartItems();
        }

        function showOrderOptions() {
            document.getElementById('showOrderOptionsBtn').style.display = 'none';
            document.getElementById('orderTypeSelection').style.display = 'block';
        }

        function selectOrderType(type) {
            document.getElementById('orderTypeSelection').style.display = 'none';
            if (type === 'personal') {
                document.getElementById('personalForm').style.display = 'block';
                document.getElementById('commercialForm').style.display = 'none';
            } else if (type === 'commercial') {
                document.getElementById('commercialForm').style.display = 'block';
                document.getElementById('personalForm').style.display = 'none';
            }
            renderCartItems();
        }

        function submitPersonalOrder(event) {
            event.preventDefault();
            const name = document.getElementById('pName').value;
            const phone = document.getElementById('pPhone').value;
            const city = document.getElementById('pCity').value;
            
            alert(`سوپاس بۆ تە ${name}!\nشار: ${city}\nداخازا شەخسی یا تە ب سەرکەفتی هاتە وەرگرتن. ئەم د زووترین دەمدا ل سەر ژمارا (${phone}) دێ پەیوەندێ ب تە کەین.`);
            
            cart = [];
            updateCartCount();
            closeCartModal();
            document.getElementById('personalForm').reset();
        }

        function submitCommercialOrder(event) {
            event.preventDefault();
            const requester = document.getElementById('cRequester').value;
            const receiver = document.getElementById('cReceiver').value;
            const phone = document.getElementById('cReceiverPhone').value;
            const city = document.getElementById('cCity').value;
            const profit = document.getElementById('cProfit').value;
            
            alert(`سوپاس بۆ تە ${requester}!\nداخازا تجارەتی یا وەرگری (${receiver}) ل شارێ (${city}) ب سەرکەفتی هاتە تۆمارکرن.\nژمارا پەیوەندیکردنێ: (${phone})\nبڕێ فایدەیێ هاتیە سەرخستن: (${profit}).\nد زووترین دەمدا کار لسەر دهێتە کرن.`);
            
            cart = [];
            updateCartCount();
            closeCartModal();
            document.getElementById('commercialForm').reset();
        }

        // پشکشکنینا نووکرنا ڕەوشا قفلا بەرهەمان لە لایەن ئەدمینیڤە ب زیندەیی
        window.addEventListener('storage', function(e) {
            if (e.key === 'productLocks' || e.key === 'productDiscounts') {
                fetchSheetData();
            }
        });

        window.onclick = function(event) {
            if (event.target == cartModal) closeCartModal();
            if (event.target == document.getElementById('productModal')) closeProductModal();
        }

        fetchSheetData();
    </script>
</body>
</html>
